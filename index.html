<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Local Workspace</title>
    <style>
        :root {
            --bg-dark: #121214;
            --panel-bg: #1a1a1e;
            --border-color: #2c2c35;
            --accent-blue: #3b82f6;
            --text-main: #e4e4e7;
            --text-muted: #a1a1aa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { font-size: 1.25rem; font-weight: 600; }
        .status-badge { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: #10b981; }
        .status-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; }

        .workspace-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Left Side: Chat Panel */
        .chat-panel {
            width: 45%;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
        }

        .chat-history {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message { padding: 0.75rem 1rem; border-radius: 8px; max-width: 85%; line-height: 1.5; font-size: 0.95rem; }
        .user-msg { background-color: var(--accent-blue); color: white; align-self: flex-end; }
        .agent-msg { background-color: var(--panel-bg); border: 1px solid var(--border-color); align-self: flex-start; white-space: pre-wrap; }

        .chat-input-area {
            padding: 1rem;
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 0.75rem;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--accent-blue); }

        button {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.75rem 1.25rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }

        /* Right Side: Files Panel */
        .files-panel {
            width: 55%;
            display: flex;
            flex-direction: column;
            background-color: var(--panel-bg);
        }

        .panel-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-system-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .file-list {
            width: 35%;
            border-right: 1px solid var(--border-color);
            padding: 0.5rem;
            overflow-y: auto;
            background-color: #16161a;
        }

        .file-item {
            padding: 0.6rem 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
        }
        .file-item:hover { background-color: var(--panel-bg); color: var(--text-main); }
        .file-item.active { background-color: rgba(59, 130, 246, 0.1); color: var(--accent-blue); font-weight: 500; }

        .file-viewer {
            width: 65%;
            padding: 1.5rem;
            overflow-y: auto;
            background-color: var(--bg-dark);
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .empty-viewer-state {
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-family: sans-serif;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <h1>Local AI Research Workspace</h1>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>Agent Core Online</span>
        </div>
    </header>

    <div class="workspace-container">
        <!-- Chat Interface -->
        <div class="chat-panel">
            <div class="chat-history" id="chatHistory">
                <div class="message agent-msg">System initialized. I have full metasearch capabilities and sandbox file system access. What are we exploring today?</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="Ask agent to search or write files..." onkeydown="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()">Execute</button>
            </div>
        </div>

        <!-- Live File Viewer -->
        <div class="files-panel">
            <div class="panel-header">
                <span>Workspace Sandboxed Files</span>
                <button onclick="refreshFileList()" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; background: transparent; border: 1px solid var(--border-color); color: var(--text-muted);">Refresh</button>
            </div>
            <div class="file-system-layout">
                <div class="file-list" id="fileList">
                    <!-- Loaded dynamically -->
                </div>
                <div class="file-viewer" id="fileViewer"><div class="empty-viewer-state">Select a file from the list to view its contents in real-time.</div></div>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'http://127.0.0.1:8000';

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatHistory = document.getElementById('chatHistory');
            const messageText = inputField.value.trim();

            if (!messageText) return;

            // Render User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.textContent = messageText;
            chatHistory.appendChild(userDiv);
            inputField.value = '';
            chatHistory.scrollTop = chatHistory.scrollHeight;

            // Render Loading Placeholder for Agent
            const agentDiv = document.createElement('div');
            agentDiv.className = 'message agent-msg';
            agentDiv.textContent = 'Thinking and executing...';
            chatHistory.appendChild(agentDiv);

            try {
                const response = await fetch(`${BACKEND_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: messageText })
                });
                const data = await response.json();
                agentDiv.textContent = data.response;
                
                // Automatically refresh file panel after every interaction in case a file changed!
                refreshFileList();
            } catch (error) {
                agentDiv.textContent = '❌ Error connecting to your local Python backend server.';
                console.error(error);
            }
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function refreshFileList() {
            const fileListContainer = document.getElementById('fileList');
            try {
                // Send dummy trigger payload to call the "list" action from the backend
                const response = await fetch(`${BACKEND_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: 'List all current files in directory' })
                });
                const data = await response.json();
                
                // Parse file string list out of the agent response
                const files = JSON.parse(data.response);
                fileListContainer.innerHTML = '';
                
                if(files.length === 0) {
                    fileListContainer.innerHTML = '<div style="padding:1rem; font-size:0.85rem; color:var(--text-muted)">No files found.</div>';
                    return;
                }

                files.forEach(filename => {
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.innerHTML = `📄 ${filename}`;
                    item.onclick = () => loadFileContent(filename, item);
                    fileListContainer.appendChild(item);
                });
            } catch (e) {
                console.error("Failed to sync file list panels:", e);
            }
        }

        async function loadFileContent(filename, element) {
            // Manage UI highlights
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            const viewer = document.getElementById('fileViewer');
            viewer.textContent = "Reading content...";

            try {
                const response = await fetch(`${BACKEND_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Read the file content of ${filename}` })
                });
                const data = await response.json();
                
                // Strip conversational prefix if backend returned it nicely formatted
                let cleanContent = data.response.replace(/📖 Content of '.*':\n\n/, '');
                viewer.textContent = cleanContent;
            } catch (error) {
                viewer.textContent = `Error reading file ${filename}`;
            }
        }

        // Run initial scan on startup
        window.onload = refreshFileList;
    </script>
</body>
</html>
