<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Workspace</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; max-width: 600px; margin: 40px auto; padding: 20px; }
        #chat-box { border: 1px solid #333; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; background: #1e1e1e; border-radius: 6px; }
        #control-panel { display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; }
        button { width: 80px; padding: 10px; background: #007acc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #005999; }
        .user { color: #4fc3f7; margin-bottom: 8px; }
        .ai { color: #a5d6a7; margin-bottom: 12px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>Local AI Workspace</h2>
    <div id="chat-box"></div>
    
    <div id="control-panel">
        <input type="text" id="user-input" placeholder="Ask your AI anything..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button type="button" onclick="sendMessage()">Send</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const messageText = input.value.trim();
            
            if (!messageText) return;

            // Immediately display user message in viewport
            chatBox.innerHTML += `<div class="user"><b>You:</b> ${messageText}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Post request target directly at the designated backend router port
                const response = await fetch('http://127.0.0.1:8000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: messageText })
                });
                
                if (!response.ok) {
                    throw new Error(`Server replied with status code ${response.status}`);
                }
                
                const data = await response.json();
                
                // Display structural system reply
                chatBox.innerHTML += `<div class="ai"><b>AI:</b> ${data.response}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                console.error(err);
                chatBox.innerHTML += `<div class="ai" style="color:red;"><b>Error:</b> Could not reach backend server or route not found.</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
