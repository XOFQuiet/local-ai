<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Core</title>
    <style>
        :root {
            --bg: #09090b;
            --panel: #121214;
            --border: #222226;
            --accent: #f4f4f5;
            --text: #e4e4e7;
            --muted: #71717a;
            --font: "SF Mono", SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 1.25rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
        }

        header h1 { font-size: 0.9rem; font-weight: 400; letter-spacing: -0.025em; color: var(--accent); }
        .status { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; color: var(--muted); }
        .status-dot { width: 6px; height: 6px; background-color: #10b981; border-radius: 50%; }

        .container { display: flex; flex: 1; overflow: hidden; }

        /* Left Side: Chat Panel */
        .chat-panel {
            width: 40%;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .chat-history {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .msg { max-width: 90%; font-size: 0.85rem; line-height: 1.6; }
        .user-msg { color: var(--accent); align-self: flex-end; text-align: right; }
        .agent-msg { color: var(--text); align-self: flex-start; border-left: 1px solid var(--border); padding-left: 1rem; }

        .input-area {
            padding: 1.5rem 2rem;
            display: flex;
            gap: 1rem;
            border-top: 1px solid var(--border);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: var(--font);
            font-size: 0.85rem;
            outline: none;
        }
        input::placeholder { color: var(--muted); }

        button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            font-family: var(--font);
            font-size: 0.75rem;
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        button:hover { border-color: var(--accent); color: var(--accent); }

        /* Right Side: Files Panel */
        .files-panel { width: 60%; display: flex; overflow: hidden; background: var(--panel); }
        
        .file-list {
            width: 30%;
            border-right: 1px solid var(--border);
            padding: 1rem;
            overflow-y: auto;
        }

        .file-item {
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-item:hover { color: var(--text); }
        .file-item.active { color: var(--accent); background: var(--bg); border: 1px solid var(--border); }

        .file-viewer {
            width: 70%;
            padding: 2rem;
            overflow-y: auto;
            background: var(--bg);
            font-size: 0.85rem;
            line-height: 1.7;
            color: var(--text);
        }

        .empty-state { color: var(--muted); display: flex; align-items: center; justify-content: center; height: 100%; font-style: italic; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <h1>workspace_core //</h1>
        <div class="status">
            <div class="status-dot"></div>
            <span>local_node_active</span>
        </div>
    </header>

    <div class="container">
        <div class="chat-panel">
            <div class="chat-history" id="chatHistory">
                <div class="msg agent-msg">System initialized. Awaiting pipeline instruction.</div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="Execute terminal command..." onkeydown="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()">Run</button>
            </div>
        </div>

        <div class="files-panel">
            <div class="file-list" id="fileList"></div>
            <div class="file-viewer" id="fileViewer">
                <div class="empty-state">No file mounted.</div>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'http://127.0.0.1:8000';

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatHistory = document.getElementById('chatHistory');
            const messageText = inputField.value.trim();

            if (!messageText) return;

            const userDiv = document.createElement('div');
            userDiv.className = 'msg user-msg';
            userDiv.textContent = `> ${messageText}`;
            chatHistory.appendChild(userDiv);
            inputField.value = '';

            const agentDiv = document.createElement('div');
            agentDiv.className = 'msg agent-msg';
            agentDiv.textContent = 'processing...';
            chatHistory.appendChild(agentDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;

            try {
                const response = await fetch(`${BACKEND_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: messageText })
                });
                const data = await response.json();
                agentDiv.textContent = data.response;
                refreshFileList();
            } catch (error) {
                agentDiv.textContent = '❌ local_node_connection_failure';
            }
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function refreshFileList() {
            const fileListContainer = document.getElementById('fileList');
            try {
                const response = await fetch(`${BACKEND_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: 'List all current files in directory' })
                });
                const data = await response.json();
                const files = JSON.parse(data.response);
                fileListContainer.innerHTML = '';
                
                files.forEach(filename => {
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.textContent = filename;
                    item.onclick = () => loadFileContent(filename, item);
                    fileListContainer.appendChild(item);
                });
            } catch (e) { console.error(e); }
        }

        async function loadFileContent(filename, element) {
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            const viewer = document.getElementById('fileViewer');
            viewer.textContent = "reading...";

            try {
                const response = await fetch(`${BACKEND_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Read the file content of ${filename}` })
                });
                const data = await response.json();
                viewer.textContent = data.response.replace(/📖 Content of '.*':\n\n/, '');
            } catch (error) { viewer.textContent = `Error mount: ${filename}`; }
        }

        window.onload = refreshFileList;
    </script>
</body>
</html>
