<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Workspace</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; max-width: 600px; margin: 40px auto; padding: 20px; }
        #chat-box { border: 1px solid #333; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; background: #1e1e1e; border-radius: 6px; }
        input { width: 75%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; }
        button { width: 20%; padding: 10px; background: #007acc; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .user { color: #4fc3f7; margin-bottom: 8px; }
        .ai { color: #a5d6a7; margin-bottom: 12px; }
    </style>
</head>
<body>
    <h2>Local AI Workspace</h2>
    <div id="chat-box"></div>
    <input type="text" id="user-input" placeholder="Ask your AI anything...">
    <button onclick="sendMessage()">Send</button>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            if (!input.value.trim()) return;

            // Display user message
            chatBox.innerHTML += `<div class="user"><b>You:</b> ${input.value}</div>`;
            const userMsg = input.value;
            input.value = '';

            try {
                // Send request to our FastAPI backend
                const response = await fetch('http://127.0.0.1:8000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userMsg })
                });
                const data = await response.json();
                
                // Display AI response
                chatBox.innerHTML += `<div class="ai"><b>AI:</b> ${data.response}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                chatBox.innerHTML += `<div class="ai" style="color:red;"><b>Error:</b> Could not connect to backend.</div>`;
            }
        }
    </script>
</body>
</html>
